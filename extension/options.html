<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workupdate AI Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">Workupdate AI</p>
      <h1>Extension settings</h1>
      <form id="settingsForm">
        <label>Backend URL</label>
        <div class="radio-stack" role="radiogroup" aria-label="Backend URL">
          <label class="radio-option">
            <input
              type="radio"
              name="backendUrl"
              value="http://localhost:3000"
            />
            <span>
              <strong>Local</strong>
              <small>http://localhost:3000</small>
            </span>
          </label>
          <label class="radio-option">
            <input
              type="radio"
              name="backendUrl"
              value="https://worklogs-wheat.vercel.app/"
            />
            <span>
              <strong>Production</strong>
              <small>https://worklogs-wheat.vercel.app/</small>
            </span>
          </label>
        </div>

        <label>Excel file</label>
        <div class="file-path-row">
          <button type="button" id="chooseExcelFile" class="file-select-button">
            Choose Excel file...
          </button>
          <button type="button" id="grantExcelAccess" class="ghost-button" hidden>
            Grant access
          </button>
        </div>
        <p id="selectedFile" class="full-path" title=""></p>

        <div class="form-actions">
          <button type="submit">Save</button>
          <p id="status" role="status"></p>
        </div>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
